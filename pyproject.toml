[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sdg-harness"
version = "0.1.0"
description = "Agentic SDG optimization harness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "structlog>=26.0",
    "click>=8.0",
    "litellm>=1.0",
]

[project.scripts]
sdg-harness = "sdg_harness.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sdg_harness"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sdg_harness"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
